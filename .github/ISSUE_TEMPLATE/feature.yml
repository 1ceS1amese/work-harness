name: Feature request
description: Propose a focused, generally useful improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. Large architecture changes should include compatibility and migration impact.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful interface and expected outcome.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note effects on Providers, Skills, Tools, storage, API contracts, or deployment.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request does not require committing or transmitting a model credential.
          required: true
