name: ${COMPOSE_PROJECT_NAME:-work-harness}

services:
  work-harness:
    image: ${WORK_HARNESS_IMAGE:-work-harness:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.4}
    init: true
    restart: unless-stopped
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ./deploy/runtime.env
        required: false
    environment:
      WORK_HARNESS_PROFILE: ${WORK_HARNESS_PROFILE:-setup}
      WORK_HARNESS_LOG_LEVEL: ${WORK_HARNESS_LOG_LEVEL:-INFO}
      WORK_HARNESS_CHECKPOINT_PATH: /app/var/checkpoints.sqlite
      WORK_HARNESS_RUN_STORE_PATH: /app/var/runs.sqlite
      WORK_HARNESS_PROVIDER_STORE_PATH: /app/var/providers.sqlite
      WORK_HARNESS_SETTINGS_PATH: /app/var/settings.json
    ports:
      - "${WORK_HARNESS_BIND_ADDRESS:-127.0.0.1}:${WORK_HARNESS_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - work_harness_data:/app/var
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: ${WORK_HARNESS_CPUS:-2.0}
    mem_limit: ${WORK_HARNESS_MEMORY_LIMIT:-2g}
    mem_reservation: ${WORK_HARNESS_MEMORY_RESERVATION:-512m}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    # Runtime requests are capped at 300s; allow an in-flight run to close cleanly.
    stop_grace_period: 330s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${WORK_HARNESS_LOG_MAX_SIZE:-10m}
        max-file: ${WORK_HARNESS_LOG_MAX_FILES:-3}

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      work-harness:
        condition: service_healthy
    environment:
      WORK_HARNESS_DOMAIN: ${WORK_HARNESS_DOMAIN:-localhost}
    ports:
      - "${WORK_HARNESS_HTTP_PORT:-80}:80"
      - "${WORK_HARNESS_HTTPS_PORT:-443}:443"
      - "${WORK_HARNESS_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: ${WORK_HARNESS_CADDY_CPUS:-0.5}
    mem_limit: ${WORK_HARNESS_CADDY_MEMORY_LIMIT:-256m}
    logging:
      driver: json-file
      options:
        max-size: ${WORK_HARNESS_LOG_MAX_SIZE:-10m}
        max-file: ${WORK_HARNESS_LOG_MAX_FILES:-3}

volumes:
  work_harness_data:
    name: ${WORK_HARNESS_DATA_VOLUME:-work-harness-data}
  caddy_data:
    name: ${WORK_HARNESS_CADDY_DATA_VOLUME:-work-harness-caddy-data}
  caddy_config:
    name: ${WORK_HARNESS_CADDY_CONFIG_VOLUME:-work-harness-caddy-config}
