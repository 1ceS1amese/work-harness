name: Windows EXE

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  executable:
    name: Windows x64 executable
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and smoke-test executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Attest executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/work-harness.exe
            dist/work-harness.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-harness-windows-x64
          path: |
            dist/work-harness.exe
            dist/work-harness.exe.sha256
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/work-harness.exe dist/work-harness.exe.sha256 --clobber
