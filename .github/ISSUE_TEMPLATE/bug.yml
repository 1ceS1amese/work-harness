name: Bug report
description: Report reproducible incorrect behavior in Work Harness.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Remove credentials, private prompts, and model responses before submitting.

  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Docker Compose
        - Source checkout
        - GitHub Release wheel
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe configuration and exact commands needed to reproduce it.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python/Node/Docker versions, browser, and selected profile.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Do not include API keys, private prompts, endpoint credentials, or confidential model output.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a vulnerability report; security issues use SECURITY.md.
          required: true
