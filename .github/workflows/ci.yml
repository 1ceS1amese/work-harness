name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest

      - name: Validate runtime contracts
        run: |
          uv run work-harness check-config
          uv run work-harness check-compatibility
          WORK_HARNESS_PROFILE=local uv run work-harness skills validate
          WORK_HARNESS_PROFILE=local uv run work-harness eval

  postgres-queue:
    name: PostgreSQL queue and blackboard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: work_harness_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d work_harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORK_HARNESS_TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/work_harness_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Test PostgreSQL queue contracts
        run: uv run pytest -q tests/test_postgres_queue.py

      - name: Test PostgreSQL blackboard contracts
        run: uv run pytest -q tests/test_blackboard_*.py -k postgres

  package:
    name: Python distribution
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Validate release metadata
        run: uv run python scripts/check_release.py

      - name: Build and verify distributions
        run: |
          uv build
          uvx twine check dist/*
          uv run python scripts/verify_wheel.py dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix frontend ci

      - name: Type-check
        run: npm --prefix frontend run type-check

      - name: Test
        run: npm --prefix frontend test

      - name: Build
        run: npm --prefix frontend run build

      - name: Install browser for UI regression tests
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Test desktop and mobile workbench
        run: npm --prefix frontend run test:e2e

  container:
    name: Container image
    needs: [package, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: |
          docker compose --profile public config --quiet
          cp .env.distributed.example .env.distributed
          cp deploy/runtime.distributed.env.example deploy/runtime.distributed.env
          docker compose \
            --env-file .env.distributed \
            -f compose.yaml \
            -f compose.distributed.yaml \
            config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: work-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
