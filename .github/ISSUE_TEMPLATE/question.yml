name: Question
description: Ask a focused usage or integration question.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private prompts, or confidential model output.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant safe configuration and commands.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
