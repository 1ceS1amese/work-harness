schema_version: 1
run_max_concurrency: 4
worker_max_concurrency: 4
reviewer_max_concurrency: 3
review_strategy: adaptive
deep_review_risk_levels: [high, critical]
deep_review_task_types: [research, decision]
max_planned_subtasks: 4
max_repair_rounds: 1
max_node_steps: 10
node_timeout_seconds: 60
run_timeout_seconds: 300
token_budget: 50000
cost_budget_usd: 5.0
max_artifact_chars: 20000
max_tool_result_chars: 8000
tool_cache_max_entries: 256
model_retry_attempts: 2
sse_keepalive_seconds: 15
recovery_enabled: true
run_lease_seconds: 30
heartbeat_interval_seconds: 10
recovery_scan_interval_seconds: 10
recovery_scan_limit: 200
checkpoint:
  backend: sqlite
  path: var/checkpoints.sqlite
run_store:
  backend: sqlite
  path: var/runs.sqlite
provider_store:
  backend: sqlite
  path: var/providers.sqlite
trace:
  enabled: true
  sample_rate: 1.0
  log_level: INFO
