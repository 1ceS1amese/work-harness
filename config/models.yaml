schema_version: 1
profile: local
providers:
  mock:
    adapter: mock
    enabled: true
    capabilities: [chat, structured_output, tool_calling]
    timeout_seconds: 5
    max_concurrency: 8
  mock-secondary:
    adapter: mock
    enabled: true
    capabilities: [chat, structured_output, tool_calling]
    timeout_seconds: 5
    max_concurrency: 8
  compatible:
    adapter: openai_compatible
    protocol_variant: openai
    api_family: chat_completions
    enabled: false
    base_url_env: MODEL_BASE_URL
    api_key_env: MODEL_API_KEY
    allowed_models: [configured-model]
    capabilities: [chat, structured_output, tool_calling]
    timeout_seconds: 60
    max_concurrency: 8
    allow_insecure_http: false
    allow_private_network: false
logical_models:
  planner-strong:
    required_capabilities: [chat, structured_output]
    candidates:
      - {provider: mock, model: mock-planner}
      - {provider: compatible, model: configured-model}
  worker-fast:
    required_capabilities: [chat, structured_output]
    candidates:
      - {provider: mock, model: mock-worker}
      - {provider: mock-secondary, model: mock-worker-secondary}
      - {provider: compatible, model: configured-model}
  reviewer-independent:
    required_capabilities: [chat, structured_output]
    candidates:
      - {provider: mock, model: mock-reviewer}
      - {provider: compatible, model: configured-model}
  judge-stable:
    required_capabilities: [chat, structured_output]
    candidates:
      - {provider: mock, model: mock-judge}
      - {provider: compatible, model: configured-model}
  synthesizer-general:
    required_capabilities: [chat]
    candidates:
      - {provider: mock, model: mock-synthesizer}
      - {provider: compatible, model: configured-model}
compatibility:
  protocol_version: "1.0"
  baseline_capabilities: [chat, structured_output, tool_calling]
  enforce_baseline: true
  require_capability_parity: true
  require_truthful_declaration: true
