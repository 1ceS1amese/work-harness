name: Windows EXE

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  executable:
    name: Windows x64 executable
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and smoke-test executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Attest executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/work-harness.exe
            dist/work-harness.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: work-harness-windows-x64
          path: |
            dist/work-harness.exe
            dist/work-harness.exe.sha256
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/work-harness.exe dist/work-harness.exe.sha256 --clobber
